aid: upstream
name: Upstream
description: Upstream is a no-code, full-stack platform for launching and operating
  DAOs (decentralized autonomous organizations), letting communities create a DAO
  with a Gnosis multi-signature wallet, DAO contract, and vote delegation contract
  without technical experience. The platform blends on-chain smart contracts (built
  on OpenZeppelin, audited by Upshield) with off-chain forums, proposals, polls, and
  events, and maintains the open-source Fortuna service that indexes ERC20/ERC721/ERC1155
  transfer events on Ethereum. Upstream is backed by Bloomberg Beta. The company does
  not currently publish a public developer API; its backend at api.upstreamapp.com
  is undocumented and product documentation lives at guide.upstreamapp.com.
